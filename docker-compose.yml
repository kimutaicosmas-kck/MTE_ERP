services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: mte_erp
      MYSQL_USER: mte
      MYSQL_PASSWORD: mtepass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: mysql://mte:mtepass@mysql:3306/mte_erp?connection_limit=25
      JWT_SECRET: mte-erp-change-in-production
      REDIS_URL: redis://redis:6379
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npx", "tsx", "src/worker.ts"]
    environment:
      DATABASE_URL: mysql://mte:mtepass@mysql:3306/mte_erp?connection_limit=10
      JWT_SECRET: mte-erp-change-in-production
      REDIS_URL: redis://redis:6379
      SKIP_DB_SETUP: "1"
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  uploads:
